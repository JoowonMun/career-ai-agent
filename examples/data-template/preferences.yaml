roles: [AI 엔지니어, AX, 데이터 분석, 데이터 사이언티스트]
keywords_include: [LLM, MLOps, 데이터 파이프라인]
keywords_exclude: [영업, 강사]
experience_years: 3

hard:                          # 필수 조건: 하나라도 어기면 제외
  regions: [서울, 경기 성남]
  remote_ignores_region: true  # 전면 재택이면 지역 조건 무시
  employment_types: [정규직]
  company_size: [대기업, 중견기업, 상장사]
  min_salary_10k_krw: 5000     # 만원 단위. 연봉을 확인할 수 있을 때만 적용
  exclude_companies: []

soft:                          # 선호 조건: Claude가 점수를 매김
  industries_prefer: [금융, 제조]
  industries_avoid: []
  ai_investment: high          # high | medium | any
  weights: {ai_investment: 3, tech_match: 3, industry: 2, salary: 2}

free_essay:                    # 공고에 자소서 문항이 없을 때 쓰는 자유 문항 (매번 확인 후 사용)
  questions:
    - {text: "지원 동기와 입사 후 포부를 작성해 주십시오.", limit: 800, count_mode: with_spaces, count_newlines: true}
    - {text: "지원 직무에 필요한 핵심 역량과 이를 보여 주는 경험을 작성해 주십시오.", limit: 800, count_mode: with_spaces, count_newlines: true}
    - {text: "어려운 문제를 정의하고 해결한 경험을 작성해 주십시오.", limit: 800, count_mode: with_spaces, count_newlines: true}
    - {text: "다른 사람과 협업한 경험과 본인이 일하는 방식을 작성해 주십시오.", limit: 800, count_mode: with_spaces, count_newlines: true}
